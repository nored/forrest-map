<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0f1210;
    --surface: rgba(26, 30, 27, 0.92);
    --text: #ecebe3;
    --muted: #9ca08f;
    --border: rgba(255,255,255,0.1);
    --accent: #5fa66b;
    --inside: #5fa66b;
    --near: #d9a93a;
    --outside: #ffffff;
    --error: #e07377;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    overscroll-behavior: none;
  }
  #map {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #222;
    z-index: 0;
  }
  .leaflet-container { background: #222; }

  .status {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: 12px;
    right: 12px;
    z-index: 500;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: center;
    transition: border-color .25s;
    max-width: 560px;
    margin: 0 auto;
  }
  .status.inside { border-color: var(--inside); }
  .status.near { border-color: var(--near); }
  .status.outside { border-color: rgba(255,255,255,0.25); }
  .status.error { border-color: var(--error); }
  .verdict {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 2px;
    line-height: 1.15;
  }
  .inside .verdict { color: var(--inside); }
  .near .verdict { color: var(--near); }
  .outside .verdict { color: var(--outside); }
  .error .verdict { color: var(--error); }
  .detail {
    color: var(--muted);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }

  .fab {
    position: fixed;
    right: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 72px);
    z-index: 500;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .fab:disabled { opacity: .4; cursor: default; }
  .fab svg { width: 22px; height: 22px; }

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 500;
    background: var(--surface);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 14px);
    transform: translateY(calc(100% - 48px));
    transition: transform .25s ease;
    max-height: 70vh;
    overflow-y: auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet .handle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    height: 28px;
  }
  .sheet .handle::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.2);
  }
  .sheet .handle span {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-top: 6px;
  }
  .sheet table {
    width: 100%;
    border-collapse: collapse;
    font-variant-numeric: tabular-nums;
    margin-top: 8px;
  }
  .sheet td {
    padding: 3px 6px 3px 0;
    font-size: 13px;
    white-space: nowrap;
  }
  .sheet td.label { color: var(--muted); width: 72px; }
  .user-pos {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .enable {
    position: fixed;
    inset: 0;
    z-index: 600;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(15,18,16,0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 20px;
  }
  .enable.show { display: flex; }
  .enable .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    max-width: 360px;
    text-align: center;
  }
  .enable h2 {
    margin: 0 0 8px;
    font-size: 18px;
  }
  .enable p {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 16px;
  }
  .enable button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0f1210;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="status" class="status outside">
  <div class="verdict" id="verdict">Waiting for GPS…</div>
  <div class="detail" id="detail">Allow location access when the browser asks.</div>
</div>

<button class="fab" id="recenter" aria-label="Recenter map" disabled>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"></circle>
    <line x1="12" y1="2" x2="12" y2="5"></line>
    <line x1="12" y1="19" x2="12" y2="22"></line>
    <line x1="2" y1="12" x2="5" y2="12"></line>
    <line x1="19" y1="12" x2="22" y2="12"></line>
  </svg>
</button>

<div class="sheet" id="sheet">
  <div class="handle" id="sheetHandle">
    <span>Plot corners</span>
  </div>
  <table id="corners"></table>
  <div class="user-pos" id="userPos" style="display:none"></div>
</div>

<div class="enable" id="enable">
  <div class="card">
    <h2>Location needed</h2>
    <p id="enableMsg">Allow location access so the map can show whether you are inside the plot.</p>
    <button id="enableBtn">Enable location</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const dms = (d, m, s) => d + m/60 + s/3600;

  const CORNERS = [
    { name: "A (NW)", lat: dms(52,11,33.32), lon: dms(13,18,50.53) },
    { name: "B (NE)", lat: dms(52,11,33.79), lon: dms(13,18,53.35) },
    { name: "D (SE)", lat: dms(52,11,30.23), lon: dms(13,18,54.40) },
    { name: "C (SW)", lat: dms(52,11,29.75), lon: dms(13,18,51.69) },
  ];
  const POLY = CORNERS.map(c => [c.lat, c.lon]);

  function inside(lat, lon, poly) {
    let hit = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [yi, xi] = poly[i];
      const [yj, xj] = poly[j];
      const crosses = (yi > lat) !== (yj > lat) &&
        lon < ((xj - xi) * (lat - yi)) / (yj - yi) + xi;
      if (crosses) hit = !hit;
    }
    return hit;
  }

  const MID_LAT = 52.1922 * Math.PI / 180;
  const M_PER_DEG_LAT = 111320;
  const M_PER_DEG_LON = 111320 * Math.cos(MID_LAT);
  function toMeters(lat, lon, refLat, refLon) {
    return [
      (lon - refLon) * M_PER_DEG_LON,
      (lat - refLat) * M_PER_DEG_LAT,
    ];
  }

  function edgeDistance(lat, lon, poly) {
    const refLat = poly[0][0], refLon = poly[0][1];
    const [px, py] = toMeters(lat, lon, refLat, refLon);
    let best = Infinity;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [ax, ay] = toMeters(poly[j][0], poly[j][1], refLat, refLon);
      const [bx, by] = toMeters(poly[i][0], poly[i][1], refLat, refLon);
      const dx = bx - ax, dy = by - ay;
      const len2 = dx*dx + dy*dy;
      let t = len2 === 0 ? 0 : ((px - ax) * dx + (py - ay) * dy) / len2;
      t = Math.max(0, Math.min(1, t));
      const cx = ax + t * dx, cy = ay + t * dy;
      const d = Math.hypot(px - cx, py - cy);
      if (d < best) best = d;
    }
    return best;
  }

  const toDMS = v => {
    const d = Math.floor(v);
    const mFloat = (v - d) * 60;
    const m = Math.floor(mFloat);
    const s = ((mFloat - m) * 60).toFixed(2);
    return `${d}° ${m}′ ${s}″`;
  };

  const cornersTable = document.getElementById("corners");
  for (const c of CORNERS) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="label">${c.name}</td>
      <td>${toDMS(c.lat)} N</td>
      <td>${toDMS(c.lon)} E</td>
    `;
    cornersTable.appendChild(tr);
  }

  const map = L.map("map", { zoomControl: true, attributionControl: true });
  const centerLat = CORNERS.reduce((s, c) => s + c.lat, 0) / CORNERS.length;
  const centerLon = CORNERS.reduce((s, c) => s + c.lon, 0) / CORNERS.length;
  map.setView([centerLat, centerLon], 19);
  map.zoomControl.setPosition("topright");

  const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
      maxZoom: 20,
      maxNativeZoom: 19,
      attribution: "Imagery © Esri, Maxar, Earthstar Geographics",
    }
  ).addTo(map);
  const streets = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, attribution: "© OpenStreetMap" }
  );
  L.control.layers(
    { "Satellite": satellite, "Street map": streets },
    {},
    { position: "topright", collapsed: true }
  ).addTo(map);

  const polyLayer = L.polygon(POLY, {
    color: "#ffdd33",
    weight: 3,
    fillColor: "#ffdd33",
    fillOpacity: 0.15,
  }).addTo(map);
  for (const c of CORNERS) {
    L.circleMarker([c.lat, c.lon], {
      radius: 5,
      color: "#ffdd33",
      fillColor: "#ffdd33",
      fillOpacity: 1,
      weight: 2,
    }).bindTooltip(c.name, { permanent: false }).addTo(map);
  }
  map.fitBounds(polyLayer.getBounds(), { padding: [60, 30] });

  let userMarker = null;
  let accuracyCircle = null;
  let firstFix = true;

  const statusEl = document.getElementById("status");
  const verdictEl = document.getElementById("verdict");
  const detailEl = document.getElementById("detail");
  const userPosEl = document.getElementById("userPos");
  const recenterBtn = document.getElementById("recenter");
  const enableEl = document.getElementById("enable");
  const enableBtn = document.getElementById("enableBtn");
  const enableMsg = document.getElementById("enableMsg");
  const sheet = document.getElementById("sheet");
  const sheetHandle = document.getElementById("sheetHandle");

  function setStatus(cls, verdict, detail) {
    statusEl.className = "status " + cls;
    verdictEl.textContent = verdict;
    detailEl.textContent = detail;
  }

  function onPosition(pos) {
    const { latitude, longitude, accuracy } = pos.coords;
    const isInside = inside(latitude, longitude, POLY);
    const dist = edgeDistance(latitude, longitude, POLY);
    const acc = Math.max(1, Math.round(accuracy));
    const distRounded = Math.round(dist);

    if (isInside) {
      if (dist < accuracy) {
        setStatus("near", "Near the edge",
          `Inside, ${distRounded} m from border · GPS ±${acc} m`);
      } else {
        setStatus("inside", "Inside the plot",
          `${distRounded} m from nearest border · GPS ±${acc} m`);
      }
    } else {
      if (dist < accuracy) {
        setStatus("near", "Near the edge",
          `Outside by ${distRounded} m · GPS ±${acc} m`);
      } else {
        setStatus("outside", `${distRounded} m away`,
          `Outside the plot · GPS ±${acc} m`);
      }
    }

    userPosEl.style.display = "block";
    userPosEl.textContent = `You: ${toDMS(latitude)} N, ${toDMS(longitude)} E · ±${acc} m`;

    if (!userMarker) {
      userMarker = L.circleMarker([latitude, longitude], {
        radius: 7,
        color: "#ffffff",
        fillColor: "#3b82f6",
        fillOpacity: 1,
        weight: 2,
      }).addTo(map);
      accuracyCircle = L.circle([latitude, longitude], {
        radius: accuracy,
        color: "#3b82f6",
        weight: 1,
        fillOpacity: 0.12,
      }).addTo(map);
      recenterBtn.disabled = false;
    } else {
      userMarker.setLatLng([latitude, longitude]);
      accuracyCircle.setLatLng([latitude, longitude]);
      accuracyCircle.setRadius(accuracy);
    }

    if (firstFix) {
      firstFix = false;
      const bounds = L.latLngBounds([[latitude, longitude], ...POLY]);
      map.fitBounds(bounds, { padding: [80, 40], maxZoom: 19 });
    }
  }

  function onError(err) {
    if (err.code === err.PERMISSION_DENIED) {
      setStatus("error", "Location blocked",
        "Enable location access in browser settings and reload.");
      enableMsg.textContent = "Location was denied. Open the browser's site settings for this page and allow location, then reload.";
      enableEl.classList.add("show");
    } else if (err.code === err.POSITION_UNAVAILABLE) {
      setStatus("error", "No GPS signal", "Move to open sky and wait a moment.");
    } else if (err.code === err.TIMEOUT) {
      setStatus("error", "GPS timeout", "Still trying. Keep the page open.");
    } else {
      setStatus("error", "Location error", err.message || "Unknown error.");
    }
  }

  function startTracking() {
    if (!("geolocation" in navigator)) {
      setStatus("error", "No GPS", "This browser does not support geolocation.");
      return;
    }
    enableEl.classList.remove("show");
    setStatus("outside", "Locating…", "Waiting for the first GPS fix.");
    navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true,
      maximumAge: 2000,
      timeout: 30000,
    });
  }

  recenterBtn.addEventListener("click", () => {
    if (userMarker) {
      const bounds = L.latLngBounds([userMarker.getLatLng(), ...POLY]);
      map.fitBounds(bounds, { padding: [80, 40], maxZoom: 19 });
    }
  });

  sheetHandle.addEventListener("click", () => {
    sheet.classList.toggle("open");
  });

  enableBtn.addEventListener("click", startTracking);

  // Auto-start on page load. Modern browsers show the native permission
  // prompt without a user gesture on HTTPS pages.
  window.addEventListener("load", () => {
    setTimeout(startTracking, 300);
    // Keep the map sized correctly after any mobile UI chrome settles.
    setTimeout(() => map.invalidateSize(), 400);
  });

  window.addEventListener("resize", () => map.invalidateSize());
  window.addEventListener("orientationchange", () => {
    setTimeout(() => map.invalidateSize(), 200);
  });
</script>
</body>
</html>
